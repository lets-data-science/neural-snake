name: Project checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      # The CPU build of the pinned torch version: the runner has no GPU.
      - name: Install pinned Python dependencies
        run: python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Install and check the browser runtime
        run: |
          npm ci
          npm run setup
          python scripts/audit_web.py
      - name: Make the data
        run: python scripts/make_data.py
      # Two tests need a trained model in models/run2_best.pt and skip here.
      - name: Python tests
        run: python -m pytest -q
      - name: JavaScript tests
        run: npm test
